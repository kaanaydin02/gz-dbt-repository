version: 2

sources:
  - name: raw
    schema: gz_raw_data

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "sales of Greenweez / we have one row per product_id found in each orders_id"

        columns:
          - name: date_date
            description: "date of purchase"
          - name: orders_id
            description: "foreign key to ship"
          - name: pdt_id
            description: "foreign key to product"
          - name: revenue
            description: "the amount paid by the customer"
          - name: quantity
            description: "quantity purchased"

        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: "products of Greenweez"

        columns:
          - name: products_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: "the purchase price of the product"

      - name: ship
        identifier: raw_gz_ship
        description: "shipping data for Greenweez orders"

        columns:
          - name: orders_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: "price customer pays for shipping"
          - name: log_cost
            description: "warehouse handling cost"
          - name: ship_cost
            description: "carrier shipping cost"